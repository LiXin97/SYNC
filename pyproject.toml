[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncomm"
version = "0.1.0"
description = "SYNC: training-free fact communication across language models through shared word indices and receiver-local word directions"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6",
  "transformers>=5.3",
  "huggingface_hub>=0.30",
  "safetensors",
  "tokenizers",
  "numpy",
  "scipy",
  "scikit-learn",
  "matplotlib",
]

[project.optional-dependencies]
mistral = ["mistral_common"]
bench = ["datasets"]

[project.urls]
Homepage = "https://lixin.ai/SYNC/"
Repository = "https://github.com/LiXin97/SYNC"

[tool.setuptools.packages.find]
where = ["src"]
